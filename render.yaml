services:
  - type: web
    name: pecup-platform
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        value: pecup_secret_demo_key_9876543210
      - key: SUPABASE_ALLOW_DEV_ANON_FALLBACK
        value: "true"
